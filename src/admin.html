<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Repbish · Админ</title>
<link rel="stylesheet" href="/style.css">
<script src="/admin.js" defer></script>
</head>
<body>
<header class="site-header"><a class="wordmark" href="/">repbish<span>.</span></a><a class="quiet-link" href="/">Дэлгүүр үзэх</a></header>
<main class="admin">
  <h1>Дэлгүүрийн админ<span>.</span></h1>
  <div class="admin-toolbars" aria-label="Админ цэс">
    <button class="secondary" type="button" data-panel="products">Бүтээгдэхүүн</button>
    <button class="secondary" type="button" data-panel="looks">Try the Look</button>
    <button class="secondary" type="button" data-panel="orders">Захиалга</button>
  </div>
  <p id="admin-message" role="status"></p>
  <section id="products-panel" class="admin-columns" aria-label="Бүтээгдэхүүн">
    <aside class="admin-panel admin-list"><button class="primary" type="button" id="new-product">Шинэ бүтээгдэхүүн</button><div id="products-list" class="admin-list"></div></aside>
    <div class="admin-panel" id="product-editor"></div>
  </section>
  <section id="looks-panel" class="admin-columns" hidden aria-label="Try the Look">
    <aside class="admin-panel admin-list"><button class="primary" type="button" id="new-look">Шинэ хослол</button><div id="looks-list" class="admin-list"></div></aside>
    <div class="admin-panel" id="look-editor"></div>
  </section>
  <section id="orders-panel" class="admin-panel" hidden aria-label="Захиалга">
    <h2>Захиалга</h2>
    <button class="secondary" id="refresh-orders" type="button">Шинэчлэх</button>
    <div id="orders-list"></div>
  </section>
</main>
</body>
</html>
